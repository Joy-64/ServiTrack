    <main>
        <h1>Contactanos</h1>
        <form action="contactanos.php" method="POST">
            
            <div class="contacto-div">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" maxlength="150" required>
            </div>
            <div class="contacto-div">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" maxlength="300" required>
            </div>
            <div class="contacto-div">
                <label for="tel">Teléfono (opcional):</label>
                <input type="text" id="tel" name="tel" maxlength="10">
            </div>
            <div class="contacto-div">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" class="contacto-msj" maxlength="500" required></textarea>
            </div>
            <div class="boton-form">
                <button type="submit">Enviar</button>
            </div>
        </form>
    </main>
