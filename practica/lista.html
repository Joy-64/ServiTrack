<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista</title>
    <style>
        body{
            padding: 0%;
            margin: auto;
            box-sizing: auto;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
        }
        ul{
            list-style-type: decimal;
        }
        button{
            background-color: black;
            color: white;
            padding: 0%;
            border-radius: 30%;

        }
        button:hover{
            background-color: white;
            color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>listas</h1>
    <h2>listas desordenadas UL</h2>
    <ul>
        <li>ingrediente 1</li>
        <li>ingrediente 2</li>
        <li>ingrediente 3</li>
        <li>ingrediente 4</li>
    </ul>

    <h2>Lista ordenada OL</h2>
    <ol start = 100>
        <li>Paso 1</li>
        <li>Paso 2</li>
        <li>Paso 3</li>
        <li>Paso 4</li>
    </ol>

    <h2>listas detalladas</h2>
    <dl>
        <dt>cafe:</dt>
            <dd>con leche</dd>
            <dd>tostadas</dd>

        <dt>Te:</dt>
            <dd>con scone</dd>
            <dd>leche de almendras</dd>
    </dl>

</body>
</html>
